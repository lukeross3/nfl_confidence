[project]
name = "nfl_confidence"
version = "0.1.0"
description = ""
authors = [{ name = "Luke Ross", email = "lukeross@umich.edu" }]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "gspread>=6.2.1",
    "numpy>=2.5.4",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "tenacity>=9.2.1",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
    "playwright>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "coverage>=7.16.2",
    "pytest-mock>=3.16.0",
    "ruff>=0.17.0",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
