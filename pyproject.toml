[project]
name = "nfl_confidence"
version = "0.1.0"
description = ""
authors = [{ name = "Luke Ross", email = "lukeross@umich.edu" }]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.3.3,<2",
    "gspread>=4.0.1,<5",
    "numpy>=1.21.2,<2",
    "requests>=2.26.0,<3",
    "bs4>=0.0.1,<0.0.2",
    "pydantic>=2.4.2,<3",
    "pydantic-settings>=2.0.3,<3",
    "loguru>=0.7.2,<0.8",
    "matplotlib>=3.8.2,<4",
    "tenacity>=9.0.0,<10",
    "pyyaml>=6.0.2,<7",
    "tqdm>=4.66.5,<5",
    "playwright>=1.60,<1.61",
]

[dependency-groups]
dev = [
    "isort>=5.12.0,<6",
    "black>=23.10.0,<24",
    "flake8>=6.1.0,<7",
    "pytest>=7.4.2,<8",
    "coverage>=7.3.2,<8",
    "pytest-mock>=3.12.0,<4",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
